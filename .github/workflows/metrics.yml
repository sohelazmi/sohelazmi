name: GitHub Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # Core config
          user: sohelazmi
          template: classic
          # We reduce 'base' to just the header to remove the cluttered text stats
          base: header
          config_timezone: Asia/Kolkata
          
          # 🏆 Achievements Plugin (Shows cool unlockable badges)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          
          # 📅 Isometric Calendar Plugin (Beautiful 3D commit graph)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # 💻 Languages Plugin (Clean language breakdown)
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 5
          plugin_languages_details: percentage
